<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>បញ្ជីកនសារិស្ស័យសង្គមកិច្ច</title>
    <style>
        body {
            background-color: #6a040f;
            color: #ffffff;
            font-family: 'Khmer OS Siemreap', 'Khmer OS Content', sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 20px;
            margin: 15px 0 20px 0;
            color: #fff;
        }
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            background-color: #8b0000;
            border: 1px solid #a52a2a;
            border-radius: 30px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .search-box input::placeholder {
            color: #ffcccc;
        }
        .search-box svg {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            fill: #ffcccc;
            width: 18px;
            height: 18px;
        }
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
        }
        .card {
            background-color: #8b0000;
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
        }
        .card:active {
            background-color: #9c0000;
        }
        .card span:first-child {
            font-size: 16px;
        }
        .card span:last-child {
            font-size: 16px;
            font-weight: bold;
        }
        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            margin-bottom: 10px;
            padding: 0;
            display: flex;
            align-items: center;
        }
        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #ffcccc;
            line-height: 1.6;
            text-align: left;
        }
    </style>
</head>
<body>

    <div id="app"></div>

    <script>
        // ទិន្នន័យស្រាប់ក្នុងកូដ មិនបាច់ពឹងផ្អែកលើဖាយ JSON ខាងក្រៅទៀតទេ
        const db = {
            main: [
                { id: "legal", title: "លិខិតបទដ្ឋានគតិយុត្ត", count: 0, hasSub: true },
                { id: "policy", title: "គោលនយោបាយ-ផែនការ", count: 1, hasSub: false },
                { id: "regulation", title: "បទដ្ឋាន", count: 1, hasSub: false },
                { id: "books", title: "សៀវភៅ", count: 0, hasSub: false },
                { id: "study", title: "ឯកសារសិក្សា", count: 0, hasSub: false },
                { id: "letters", title: "លិខិត", count: 0, hasSub: false }
            ],
            sub: {
                legal: [
                    { title: "ច្បាប់", count: 0 },
                    { title: "ព្រះរាជក្រឹត្យ", count: 0 },
                    { title: "អនុក្រឹត្យ", count: 0 },
                    { title: "ប្រកាស", count: 0 },
                    { title: "សារាចរ", count: 0 },
                    { title: "សេចក្តីសម្រេច", count: 0 }
                ]
            }
        };

        let currentView = 'main';
        let currentSubKey = null;
        let searchQuery = '';

        function render() {
            const app = document.getElementById('app');
            let html = '';

            if (currentView === 'main') {
                html += `
                    <h1>បញ្ជីកនសារិស្ស័យសង្គមកិច្ច</h1>
                    <div class="search-box">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        <input type="text" id="searchInput" placeholder="ស្វែងរកសៀវភៅ..." value="${searchQuery}" oninput="handleSearch(event)">
                    </div>
                    <div class="card-list">
                `;

                const filtered = db.main.filter(item => item.title.toLowerCase().includes(searchQuery.toLowerCase()));
                
                filtered.forEach(item => {
                    html += `
                        <div class="card" onclick="handleCardClick('${item.id}', ${item.hasSub})">
                            <span>${item.title}</span>
                            <span>${item.count}</span>
                        </div>
                    `;
                });

                html += `</div>`;
            } else if (currentView === 'sub') {
                const subItems = db.sub[currentSubKey] || [];
                const parentItem = db.main.find(m => m.id === currentSubKey);
                const title = parentItem ? parentItem.title : 'លិខិតបទដ្ឋានគតិយុត្ត';

                html += `
                    <button class="back-btn" onclick="goBack()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                    </button>
                    <h1>${title}</h1>
                    <div class="search-box">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        <input type="text" id="searchInput" placeholder="ស្វែងរកសៀវភៅ..." value="${searchQuery}" oninput="handleSearch(event)">
                    </div>
                    <div class="card-list">
                `;

                const filteredSub = subItems.filter(item => item.title.toLowerCase().includes(searchQuery.toLowerCase()));

                filteredSub.forEach(item => {
                    html += `
                        <div class="card">
                            <span>${item.title}</span>
                            <span>${item.count}</span>
                        </div>
                    `;
                });

                html += `</div>`;
            }

            html += `
                <footer>
                    ទូរសព្ទ៖ ០៧០ ២២ ៥៥ ៤៤<br>
                    អ៊ីមែល៖ pesethlyma@gmail.com<br>
                    ២០២៦ / បញ្ជីកនសារិស្ស័យសង្គមកិច្ច
                </footer>
            `;

            app.innerHTML = html;
        }

        function handleCardClick(id, hasSub) {
            if (hasSub) {
                currentView = 'sub';
                currentSubKey = id;
                searchQuery = '';
                render();
            }
        }

        function goBack() {
            currentView = 'main';
            currentSubKey = null;
            searchQuery = '';
            render();
        }

        function handleSearch(e) {
            searchQuery = e.target.value;
            render();
            const input = document.getElementById('searchInput');
            if(input) {
                input.focus();
                input.selectionStart = input.selectionEnd = input.value.length;
            }
        }

        render();
    </script>
</body>
</html>
