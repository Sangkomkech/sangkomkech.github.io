<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>បណ្ដុំឯកសារវិស័យសង្គមកិច្ច</title>
<link href="https://fonts.googleapis.com/css2?family=Moul&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6e1200">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#6e1200;--card:#7f2314;--fg:#fff;--mut:#f0c9bd;--chip:#b8300f;--fab:#f0b94a;--bd:#a53a22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans Khmer","Khmer OS",sans-serif}
#home{max-width:700px;margin:0 auto;min-height:100vh;padding-bottom:20px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:6px;padding:14px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.top h1{flex:1;min-width:0;font-size:16px;line-height:1.9;margin:0 4px;font-weight:400;text-align:center;font-family:"Khmer OS Muol Light","Moul","Noto Serif Khmer",serif;overflow-wrap:anywhere}
.ib{width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--fg);cursor:pointer;flex:none}
.ib svg{width:24px;height:24px;fill:currentColor}
#sw{padding:0 14px 10px;position:relative}
#sw input{width:100%;padding:14px 48px 14px 50px;border-radius:28px;border:2px solid var(--bd);background:var(--card);color:var(--fg);font-size:17px;font-family:inherit;outline:none}
#sw input:focus{border-color:var(--fab)}
#sw .si{position:absolute;left:30px;top:16px;width:22px;height:22px;fill:none;stroke:var(--mut);stroke-width:2.2;stroke-linecap:round;pointer-events:none}
#sw .cl{position:absolute;right:20px;top:7px;width:40px;height:40px;border:0;background:none;color:var(--mut);font-size:20px;cursor:pointer}
.panel{margin:0 14px;padding:4px 0}
.it{display:flex;align-items:center;gap:14px;padding:18px 14px;border-radius:12px;cursor:pointer;background:var(--card);margin-bottom:8px}
.it .n{flex:1;font-size:19px;overflow-wrap:anywhere}
.it .c{color:var(--mut);font-size:15px}
.brow{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:8px 0 0}
.bk{background:var(--card);border-radius:12px;padding:10px 10px 12px;cursor:pointer;min-width:0}
.bcov{width:100%;aspect-ratio:3/4;background:#4a0b00;border-radius:4px;display:grid;place-items:center;color:#d9a;font-size:14px;overflow:hidden}
.bcov img{width:100%;height:100%;object-fit:cover;display:block}
.bnm{margin-top:10px;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.bar{height:24px;background:#8f6359;margin:0 -10px 20px;box-shadow:0 8px 10px rgba(0,0,0,.25)}
.empty{text-align:center;padding:70px 20px;line-height:1.8;color:var(--mut)}
.ft{margin-top:auto;padding:28px 14px 8px;text-align:left;line-height:2;font-size:16px;color:var(--mut)}
.ft a{color:var(--fg);text-decoration:none}
</style>
</head>
<body>
<div id="home">
  <div class="top">
    <button class="ib" id="bk" style="visibility:hidden"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>
    <h1 id="hd"></h1><span style="width:44px;flex:none"></span>
  </div>
  <div id="sw"><svg class="si" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20.5 20.5"/></svg><input id="q" placeholder="ស្វែងរកសៀវភៅ..."><button class="cl" id="cl">✕</button></div>
  <div class="panel"><div id="items"></div></div>
  <div class="ft">ទូរសព្ទ: <a href="tel:070225544">០៧០ ២២ ៥៥ ៤៤</a><br>អុីម៉ែល: <a href="mailto:pesethlyma@gmail.com">pesethlyma@gmail.com</a><br>២០២៦ / បណ្ដុំឯកសារវិស័យសង្គមកិច្ច<br><span id="st" style="font-size:13px;opacity:.7"></span></div>
</div>
<script>
// ជំនួសតំណខាងក្រោមដោយ Google Sheet CSV Export Link របស់បង
// ទម្រង់៖ https://docs.google.com/spreadsheets/d/ID_សន្លឹកកិច្ចការរបស់អ្នក/export?format=csv
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1_YOUR_SPREADSHEET_ID_HERE/export?format=csv";

const TITLE="បណ្ដុំឯកសារវិស័យសង្គមកិច្ច";
const DEFAULT_MAIN = ["លិខិតបទដ្ឋានគតិយុត្ត", "គោលនយោបាយ-ផែនការ", "បទដ្ឋាន", "សៀវភៅ", "ឯកសារសិក្សា", "លិខិត"];
const LEGAL_SUBS = ["ច្បាប់", "ព្រះរាជក្រឹត្យ", "អនុក្រឹត្យ", "ប្រកាស", "សារាចរ", "សេចក្តីសម្រេច"];

const $=id=>document.getElementById(id);
let root={name:"",folders:[],books:[],parent:null},cur=root,allBooks=[],filter="";

function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=""}else if(c=='\n'){r.push(f);rows.push(r);r=[];f=""}else if(c!='\r')f+=c}if(f||r.length){r.push(f);rows.push(r)}return rows}
function gid(u){const m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);return m?m[1]:""}
function coverUrl(u){
  u=(u||"").trim();
  if(!u)return"";
  const id=gid(u);
  if(id){
    return "https://drive.google.com/thumbnail?id=" + id + "&sz=w400";
  }
  return u;
}
function cleanName(s){return s.replace(/^[០-៩0-9]+[\.\-]\s*/, '').trim()}

function build(text){
  root={name:"",folders:[],books:[],parent:null};allBooks=[];
  
  const mainFoldersMap = {};
  DEFAULT_MAIN.forEach(mName => {
    const mFolder = {name: mName, folders: [], books: [], parent: root};
    root.folders.push(mFolder);
    mainFoldersMap[mName] = mFolder;
    
    if(mName === "លិខិតបទដ្ឋានគតិយុត្ត"){
      LEGAL_SUBS.forEach(subName => {
        mFolder.folders.push({name: subName, folders: [], books: [], parent: mFolder});
      });
    }
  });

  parseCSV(text).slice(1).forEach(r=>{
    let rawPath = (r[0]||"").split("/").map(s=>cleanName(s)).filter(Boolean);
    if(rawPath.length === 0) return;

    if(rawPath.length === 1 && LEGAL_SUBS.includes(rawPath[0])){
      rawPath = ["លិខិតបទដ្ឋានគតិយុត្ត", rawPath[0]];
    }

    let node = root;
    rawPath.forEach(p=>{
      let f = node.folders.find(x=>x.name === p);
      if(!f){
        f = {name: p, folders: [], books: [], parent: node};
        node.folders.push(f);
      }
      node = f;
    });

    const name=(r[1]||"").trim(), url=(r[2]||"").trim();
    if(name&&url){
      const b={name,url,cover:coverUrl(r[3])};
      node.books.push(b);
      allBooks.push(b);
    }
  });
  cur=root;
}

function count(n){return n.books.length+n.folders.reduce((s,f)=>s+count(f),0)}

function render(){
  $("hd").textContent=cur===root?TITLE:cur.name;
  $("bk").style.visibility=(cur!==root&&!filter)?"visible":"hidden";
  const box=$("items");box.innerHTML="";
  let folders=cur.folders,books=cur.books;
  if(filter){folders=[];books=allBooks.filter(b=>b.name.toLowerCase().includes(filter))}
  if(!folders.length&&!books.length){box.innerHTML='<div class="empty">'+(filter?'រកមិនឃើញ':'មិនទាន់មានសៀវភៅ')+'</div>';return}
  
  folders.forEach(f=>{
    const d=document.createElement("div");d.className="it";
    d.innerHTML='<div class="n"></div><div class="c">'+count(f)+'</div>';
    d.firstChild.textContent=f.name;
    d.onclick=()=>{cur=f;render();scrollTo(0,0)};
    box.appendChild(d);
  });

  for(let i=0;i<books.length;i+=2){
    const row=document.createElement("div");row.className="brow";
    books.slice(i,i+2).forEach(b=>{
      const c=document.createElement("div");c.className="bk";
      const cv=document.createElement("div");cv.className="bcov";
      if(b.cover){
        const im=document.createElement("img");
        im.src=b.cover;
        im.alt="";
        im.onerror=()=>{im.remove();cv.textContent="PDF"};
        cv.appendChild(im);
      }else{
        cv.textContent="PDF";
      }
      const nm=document.createElement("div");nm.className="bnm";nm.textContent=b.name;
      c.append(cv,nm);
      c.onclick=()=>{const a=document.createElement("a");a.href=b.url;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()};
      row.appendChild(c);
    });
    box.appendChild(row);
    const bar=document.createElement("div");bar.className="bar";box.appendChild(bar);
  }
}

$("bk").onclick=()=>{if(cur.parent){cur=cur.parent;render()}};
$("q").oninput=e=>{filter=e.target.value.trim().toLowerCase();render()};
$("cl").onclick=()=>{$("q").value="";filter="";render();$("q").focus()};

async function init(){
  $("hd").textContent=TITLE;
  $("items").innerHTML='<div class="empty">កំពុងទាញទិន្នន័យពី Google Sheet...</div>';
  $("st").textContent="កំពុងភ្ជាប់...";
  try{
    const r = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes("?")?"&":"?") + "t=" + Date.now());
    if(!r.ok) throw new Error("Network error");
    const t = await r.text();
    build(t);
    render();
    $("st").textContent="ធ្វើបច្ចុប្បន្នភាពជោគជ័យ ✓";
  }catch(e){
    $("st").textContent="មិនអាចទាញទិន្នន័យបាន";
    $("items").innerHTML='<div class="empty">សូមពិនិត្យមើលតំណ Google Sheet CSV របស់អ្នក<br>ឬធានាថា Google Sheet ត្រូវបានដាក់សិទ្ធិសាធារណៈ (Anyone with the link can view)</div>';
  }
}

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
init();
</script>
</body>
</html>
